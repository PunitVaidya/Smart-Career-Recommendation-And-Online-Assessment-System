<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assessment Submitted | Giris Tech Hub</title>

<link rel="stylesheet" href="../css/assessment-submitted.css">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

	<div class="submitted-container">

		<!-- ================= SUCCESS ================= -->

		<div class="success-section">

			<div class="success-icon">

				<i class="fa-solid fa-circle-check"></i>

			</div>

			<h1 id="submitTitle">Assessment Submitted Successfully</h1>

			<p id="submitMessage">Your assessment has been submitted
				successfully.</p>

		</div>



		<!-- ================= SUMMARY ================= -->

		<div class="summary-card">

			<h2 id="assessmentName">Java Aptitude Test</h2>


			<div class="summary-row">

				<span>Total Questions</span> <strong id="totalQuestions">

					20 </strong>

			</div>

			<div class="summary-row">

				<span>Answered</span> <strong id="answeredQuestions"> 20 </strong>

			</div>

			<div class="summary-row">

				<span>Not Answered</span> <strong id="notAnsweredQuestions">

					0 </strong>

			</div>

			<div class="summary-row">

				<span>Time Taken</span> <strong id="timeTaken"> 00:25:18 </strong>

			</div>

			<div class="summary-row">

				<span>Status</span> <strong class="status"> Submitted </strong>

			</div>

		</div>



		<!-- ================= BUTTONS ================= -->

		<div class="button-group">

			<button class="result-btn" id="viewResultButton">

				<i class="fa-solid fa-chart-column"></i> View Result

			</button>


			<button class="dashboard-btn" id="dashboardButton">

				<i class="fa-solid fa-house"></i> Back To Dashboard

			</button>

		</div>

	</div>

	<script src="../js/assessment-submitted.js"></script>

</body>

</html>
