<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | Giri's Tech Hub</title>

<link rel="stylesheet" href="../css/student-login.css">

<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

	<div class="container">

		<!-- ================= LEFT PANEL ================= -->

		<div class="left-panel">

			<img src="../images/GthTransparent.png" class="logo" alt="Logo">

			<h1>Welcome Back!</h1>

			<p>Login to continue your learning journey, access online
				assessments, career guidance and placement preparation.</p>

			<div class="login-tag">

				<span>STUDENT LOGIN</span>

			</div>

			<div class="features">

				<div class="feature">

					<i class="fa-solid fa-user-graduate"></i> <span>Career
						Guidance</span>

				</div>

				<div class="feature">

					<i class="fa-solid fa-file-lines"></i> <span>Online
						Assessments</span>

				</div>

				<div class="feature">

					<i class="fa-solid fa-briefcase"></i> <span>Placement
						Preparation</span>

				</div>

			</div>

		</div>

		<!-- ================= RIGHT PANEL ================= -->

		<div class="right-panel">

			<div class="form-card">

				<h2>Student Login</h2>

				<p>Login to access your dashboard.</p>

				<form id="loginForm">

					<!-- Email -->

					<div class="input-box">

						<i class="fa-solid fa-envelope"></i> <input type="email"
							id="email" placeholder="Email Address" required>

					</div>

					<!-- Password -->

					<div class="input-box password-box">

						<i class="fa-solid fa-lock"></i> <input type="password"
							id="password" placeholder="Password" required> <i
							class="fa-solid fa-eye toggle-password"></i>

					</div>

					<!-- Options -->

					<div class="options">

						<label> <input type="checkbox"> Remember Me

						</label> <a href="#">Forgot Password?</a>

					</div>

					<!-- Login Button -->

					<button class="login-btn">Login</button>

				</form>

				<div class="register-link">

					Don't have an account? <a href="register.html"> Register </a>

				</div>

			</div>

		</div>

	</div>

	<script src="../js/student-login.js"></script>

</body>

</html>
